<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prequel</title>
<meta name="description" content="The behind-the-scenes of everything you're becoming.">
<meta name="theme-color" content="#FAF3DC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Prequel">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<main id="app" class="screen"></main>
<noscript>This app needs JavaScript turned on.</noscript>
<div id="rescue" hidden><div class="rescuebox"><img src="icons/icon-192.png" alt="" width="72" height="72"><h1>Prequel didn't open properly</h1><p>Your data is safe on this phone. Let's try again.</p><button type="button" id="rescueTry">Try again</button><button type="button" id="rescueFix">Fix and reopen</button><p class="rescuenote">"Fix and reopen" clears Prequel's saved app files (not your data) and loads them fresh.</p><p id="rescueWhy"></p></div></div>
<script>
// Start-up safety net (v53): if the app hasn't drawn its first screen after a while, or something fails to load,
// show a friendly screen instead of a blank page. Plain JavaScript on purpose, so it works even when the app can't.
(function () {
  var started = false, shown = false, why = [];
  function show(msg) {
    if (started || shown) return; shown = true;
    var r = document.getElementById('rescue'); if (!r) return;
    if (msg) why.push(String(msg).slice(0, 160));
    document.getElementById('rescueWhy').textContent = why.join(' · ');
    r.hidden = false;
  }
  window.prequelStarted = function () { started = true; var r = document.getElementById('rescue'); if (r) r.hidden = true; };
  window.prequelFailed = function (e) { show((e && e.message) || e); };
  window.addEventListener('error', function (e) { if (!started) why.push(String(e.message || (e.target && e.target.src) || 'a file failed to load').slice(0, 160)); }, true);
  window.addEventListener('unhandledrejection', function (e) { if (!started) why.push(String((e.reason && e.reason.message) || e.reason).slice(0, 160)); });
  setTimeout(function () { show(why.length ? '' : 'it took too long to start'); }, 12000);
  document.addEventListener('click', function (e) {
    if (e.target.id === 'rescueTry') location.reload();
    if (e.target.id === 'rescueFix') {
      e.target.textContent = 'Fixing…';
      var jobs = [];
      if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
      if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
      Promise.all(jobs).catch(function () {}).then(function () { location.replace(location.pathname + '?fresh=' + Date.now()); });
    }
  });
})();
</script>
<script type="module" src="js/app.js"></script>
</body>
</html>
